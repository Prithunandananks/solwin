name: Repository policy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  review-foundation:
    name: Review foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify review guidance
        shell: bash
        run: |
          test -f AGENTS.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f docs/PR_REVIEW.md
          grep -Fq '## Code Review Rules' AGENTS.md
          grep -Fq '## Manual GitHub settings' docs/PR_REVIEW.md
